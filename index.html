<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>闪漫 AI 管理后台</title>
  <link rel="stylesheet" href="./admin.css?v=20260809-032">
</head>
<body>
  <section id="loginView" class="login-shell" data-login-shell>
    <div class="login-stage">
      <section class="login-showcase" aria-label="闪漫视界几何角色互动区" data-character-scene data-interaction-mode="idle">
        <div class="showcase-brand">
          <span class="showcase-logo" aria-hidden="true"><i></i></span>
          <strong>ShanManShiJie</strong>
        </div>
        <div class="character-cluster" data-character-cluster aria-hidden="true">
          <div class="character character-violet" data-character="violet">
            <div class="character-body" data-character-body>
              <div class="character-face">
                <span class="character-eye" data-eye="left"><i class="character-pupil"></i></span>
                <span class="character-eye" data-eye="right"><i class="character-pupil"></i></span>
              </div>
            </div>
          </div>
          <div class="character character-charcoal" data-character="charcoal">
            <div class="character-body" data-character-body>
              <div class="character-face">
                <span class="character-eye" data-eye="left"><i class="character-pupil"></i></span>
                <span class="character-eye" data-eye="right"><i class="character-pupil"></i></span>
              </div>
            </div>
          </div>
          <div class="character character-orange" data-character="orange">
            <div class="character-body" data-character-body>
              <div class="character-face">
                <span class="character-eye dot-eye" data-eye="left"><i class="character-pupil"></i></span>
                <span class="character-eye dot-eye" data-eye="right"><i class="character-pupil"></i></span>
              </div>
            </div>
          </div>
          <div class="character character-yellow" data-character="yellow">
            <div class="character-body" data-character-body>
              <div class="character-face">
                <span class="character-eye dot-eye" data-eye="left"><i class="character-pupil"></i></span>
                <span class="character-eye dot-eye" data-eye="right"><i class="character-pupil"></i></span>
                <span class="character-mouth"></span>
              </div>
            </div>
          </div>
        </div>
        <p class="scene-caption">智能体制作&nbsp;&nbsp;·&nbsp;&nbsp;技能编排&nbsp;&nbsp;·&nbsp;&nbsp;工作区配置</p>
      </section>

      <form id="loginForm" class="login-card" data-login-form>
        <div class="login-heading">
          <p class="eyebrow">SHANMAN CONTROL</p>
          <h1>欢迎回来！</h1>
          <p class="muted">请输入管理员账号与密码</p>
        </div>
        <label for="adminIdentifier">账号或邮箱<input id="adminIdentifier" name="identifier" autocomplete="username" placeholder="请输入管理员账号" data-login-field="identifier" required></label>
        <label for="adminPassword">密码<input id="adminPassword" name="password" type="password" autocomplete="current-password" placeholder="请输入登录密码" data-login-field="password" required></label>
        <label id="apiBaseField" hidden>后台 API 地址<input id="apiBaseInput" name="apiBase" type="url" inputmode="url" autocomplete="url" placeholder="https://api.example.com"></label>
        <button class="primary wide login-submit" type="submit" data-login-submit>登录管理后台 <span aria-hidden="true">→</span></button>
        <p id="loginError" class="error" role="alert"></p>
        <p class="login-footnote"><span></span> 安全加密连接</p>
      </form>
    </div>
  </section>

  <div id="appView" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand"><span>闪</span><div><strong>闪漫 AI</strong><small>单管理员后台</small></div></div>
      <nav id="navigation">
        <button data-page="dashboard" class="active">概览</button>
        <button data-page="agents">智能体</button>
        <button data-page="skills">技能</button>
        <button data-page="users">用户与授权</button>
        <button data-page="audit">操作与统计</button>
      </nav>
      <div class="sidebar-bottom"><span id="adminIdentity"></span><button id="logoutButton" class="ghost">退出登录</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><button id="menuButton" class="menu-button" aria-label="展开菜单">☰</button><div><p id="pageEyebrow" class="eyebrow">OVERVIEW</p><h1 id="pageTitle">平台概览</h1></div><button id="refreshButton" class="secondary">刷新</button></header>
      <div id="notice" class="notice" hidden></div>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>
  <div id="dialogRoot"></div>
  <script src="./config.js?v=20260803-028"></script>
  <script src="./admin.js?v=20260809-031" defer></script>
</body>
</html>
